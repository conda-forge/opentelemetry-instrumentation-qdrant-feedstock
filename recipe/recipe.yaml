schema_version: 1

context:
  name: opentelemetry-instrumentation-qdrant
  version: "0.63.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/opentelemetry_instrumentation_qdrant-${{ version }}.tar.gz
  sha256: b4bf85f2ee14d936311fabdf59de9c683c6d5c7b57acb719e96f13ecef40a622

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.63b1
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
  run_constraints:
    - qdrant-client >=1.9.1,<2.0.0

tests:
  - requirements:
      run:
        - python ${{ python_min }}.*
        - qdrant-client
        - pip
    script:
      - python -c "import opentelemetry.instrumentation.qdrant"
      - pip check

about:
  summary: OpenTelemetry Qdrant instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://www.traceloop.com/openllmetry
  repository: https://github.com/traceloop/openllmetry
  documentation: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
